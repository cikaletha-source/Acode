<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cari Produk dengan Kode</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--text:#1f1a14;--muted:#6f655a;--accent:#b4531f;--accent-text:#fff;--border:#e6ddd0;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--card:#221c16;--text:#f3ece2;--muted:#a89d8f;--accent:#e07a3f;--accent-text:#1a1008;--border:#3a3027;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130f;--card:#221c16;--text:#f3ece2;--muted:#a89d8f;--accent:#e07a3f;--accent-text:#1a1008;--border:#3a3027;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:40px 20px 56px}
h1{font-size:1.7rem;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 24px}
.bar{display:flex;gap:8px}
input{flex:1;min-width:0;font-size:1.05rem;padding:14px 16px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);text-transform:uppercase;letter-spacing:.06em}
input:focus{outline:2px solid var(--accent);border-color:transparent}
button,.beli{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-text);border:0;border-radius:12px;padding:14px 20px;cursor:pointer;text-decoration:none;display:inline-block}
#hasil{margin-top:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.foto{aspect-ratio:4/3;background:linear-gradient(135deg,var(--border),var(--bg));display:flex;align-items:center;justify-content:center;font-size:3rem}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.isi{padding:18px}
.kode{font-size:.8rem;color:var(--muted);letter-spacing:.08em}
.nama{font-size:1.2rem;font-weight:700;margin:4px 0}
.harga{color:var(--accent);font-weight:700;margin-bottom:8px}
.desk{color:var(--muted);margin:0 0 16px}
.kosong{text-align:center;color:var(--muted);padding:28px 12px;border:1.5px dashed var(--border);border-radius:16px}
.contoh{margin-top:14px;font-size:.85rem;color:var(--muted)}
.contoh b{cursor:pointer;color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>Punya kode produk?</h1>
  <p class="sub">Masukkan kode yang kamu dapat, produknya langsung muncul.</p>
  <div class="bar">
    <input id="q" type="text" placeholder="Masukkan kode produk" autocomplete="off" autocapitalize="characters" aria-label="Kode produk">
    <button id="cari" type="button">Cari</button>
  </div>
  <div class="contoh" id="contoh"></div>
  <div id="hasil"></div>
</main>

const $ = id => document.getElementById(id);
const norm = s => s.trim().toUpperCase().replace(/\s+/g,"");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const aman = u => /^https?:\/\//i.test(u) ? u : "#";

$("contoh").addEventListener("click", e => { const k = e.target.dataset.k; if(k){ $("q").value = k; cari(); } });

function cari(){
  const k = norm($("q").value);
  const out = $("hasil");
  if(!k){ out.innerHTML = ""; return; }
  const p = PRODUK.find(x => norm(x.kode) === k);
  if(!p){
    out.innerHTML = `<div class="kosong">Kode “${esc(k)}” tidak ditemukan.<br>Periksa kembali kodenya ya.</div>`;
    return;
  }
  const foto = p.foto ? `<img src="${esc(p.foto)}" alt="${esc(p.nama)}">` : "🛍️";
  out.innerHTML = `<div class="card"><div class="foto">${foto}</div><div class="isi">
    <div class="kode">KODE ${esc(p.kode)}</div><div class="nama">${esc(p.nama)}</div>
    <div class="harga">${esc(p.harga)}</div><p class="desk">${esc(p.deskripsi||"")}</p>
    <a class="beli" href="${esc(aman(p.link))}" target="_blank" rel="noopener">Lihat &amp; Beli Produk</a></div></div>`;
}
$("cari").addEventListener("click", cari);
$("q").addEventListener("keydown", e => { if(e.key==="Enter") cari(); });
</script>
